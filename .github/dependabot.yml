# Version updates wait 14 days after a release (a hijacked release is usually pulled within
# days); security updates are not subject to the cooldown. Work lands on develop, so do these.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      images:
        patterns: ["*"]
    ignore:
      # The image ships Python 3.13; a new minor or major is a decision, not an update
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
