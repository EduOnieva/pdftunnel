name: Release

# Image tags follow the branches: `develop` tracks the develop branch, `latest` tracks main,
# and a `vX.Y` tag publishes X.Y and X and refreshes the Docker Hub overview.
# The weekly run rebuilds main from scratch and republishes `latest`, X.Y and X, so base image
# and Alpine package fixes reach the released image without a code change.
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Two pushes in quick succession must publish in order, not race for the same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_DOCKERHUB: eduonieva/pdftunnel
  IMAGE_GHCR: ghcr.io/eduonieva/pdftunnel
  # cloudflared releases younger than this are not bundled yet (see scripts/cloudflared-tag.sh)
  CLOUDFLARED_GRACE_DAYS: 14

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: version
        name: the package version, which a git tag must match
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            [ "$tag" = "$version" ] || { echo "tag v$tag but pyproject.toml says $version"; exit 1; }
          fi

      - id: cloudflared
        name: the cloudflared release to bundle
        run: |
          tag=$(./scripts/cloudflared-tag.sh "$CLOUDFLARED_GRACE_DAYS")
          echo "cloudflared $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.IMAGE_DOCKERHUB }}
            ${{ env.IMAGE_GHCR }}
          # Versions have two parts (v1.2), which is not semver, so the numbered tags are matches
          tags: |
            type=match,pattern=v(\d+\.\d+),group=1
            type=match,pattern=v(\d+)\.\d+,group=1
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            # main is the last release, so the weekly rebuild refreshes its numbered tags too
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name != 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ github.event_name != 'push' && github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=pdftunnel
            org.opencontainers.image.description=Publish PDFs and other files from a folder through a Cloudflare Tunnel
            org.opencontainers.image.licenses=MIT
            io.github.eduonieva.pdftunnel.cloudflared=${{ steps.cloudflared.outputs.tag }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CLOUDFLARED_TAG=${{ steps.cloudflared.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          # A rebuild for base-image fixes must not reuse last week's apk layer
          pull: true
          no-cache: ${{ github.event_name != 'push' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The VEX statement in .vex/ names the published image: every tag just pushed and the
      # digest, so Docker Scout matches it whichever reference it analyses. Attaching it is
      # experimental on Scout's side, so a failure here never fails the release
      - id: vex
        name: VEX statement for the published tags
        run: |
          jq --arg digest "${{ steps.build.outputs.digest }}" --rawfile tags <(printf '%s\n' "${{ steps.meta.outputs.tags }}") '
            (($tags | split("\n") | map(select(length > 0))
              | map(if startswith("ghcr.io/") then (ltrimstr("ghcr.io/") | split(":") | "pkg:docker/\(.[0])@\(.[1])?repository_url=ghcr.io")
                    else (split(":") | "pkg:docker/\(.[0])@\(.[1])") end)
            ) + ["pkg:docker/eduonieva/pdftunnel@\($digest)"]) as $ids
            | .statements[0].products = ($ids | map({"@id": .}))
            | .timestamp = (now | todate)
          ' .vex/cloudflared.vex.json > /tmp/pdftunnel.vex.json
          jq -r '.statements[0].products[]["@id"]' /tmp/pdftunnel.vex.json
      - name: Attach the VEX statement to the image
        continue-on-error: true
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          command: attestation-add
          image: ${{ env.IMAGE_DOCKERHUB }}@${{ steps.build.outputs.digest }}
          file: /tmp/pdftunnel.vex.json
          predicate-type: https://openvex.dev/ns/v0.2.0
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Needs a Docker Hub token with read, write and delete scope; a read/write one gets a 403.
      # The image is already published by then, so a failure here never fails the release.
      - name: Docker Hub overview from the README
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_DOCKERHUB }}
          short-description: Publish PDFs and other files from a folder through a Cloudflare Tunnel
          readme-filepath: ./README.md
