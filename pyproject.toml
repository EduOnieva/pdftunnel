[project]
name = "pdftunnel"
version = "1.2"
description = "Publish PDFs and other files from a folder through a Cloudflare Tunnel"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Eduardo Onieva" }]
keywords = ["pdf", "cloudflare", "tunnel", "docker", "self-hosted", "static-files"]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi==0.162.0",
    "jinja2==3.1.6",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "pyjwt[crypto]==2.15.1",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[project.urls]
Homepage = "https://github.com/EduOnieva/pdftunnel"

[project.scripts]
pdftunnel = "pdftunnel.cli:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "types-pyyaml==6.0.12.20261103",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdftunnel"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "C4",        # comprehensions
    "RET",       # return
    "PIE",
    "PERF",
    "RUF",
    "ASYNC",
    "ANN",       # every signature typed
    "PTH",       # pathlib over os.path
    "T20",       # no print outside the CLI
    "ERA",       # no commented-out code
    "G",         # lazy logging args
    "LOG",
    "PLE", "PLW",
    "S",         # bandit: the server is public-facing
]
ignore = [
    "ANN401",    # Any is sometimes the honest type for JSON payloads
    "S101",      # assert is how tests assert; the source has none
]

[tool.ruff.lint.per-file-ignores]
"src/pdftunnel/cli.py" = ["T20"]
"tests/**" = ["ANN", "PLR2004", "ASYNC109", "ASYNC110", "ASYNC240", "S"]

[tool.ruff.lint.isort]
known-first-party = ["pdftunnel"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["src/pdftunnel", "tests"]
mypy_path = "src"
explicit_package_bases = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
# Test functions stay unannotated; their bodies are still checked
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/web"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pdftunnel"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
